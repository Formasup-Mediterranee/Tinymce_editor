<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur de cours - PolyAéro</title>

    <link rel="stylesheet" href="styles.css">
    <script src="/tinymce/tinymce.min.js"></script>
</head>

<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Génération en cours...</div>
        <div class="loading-subtext">L'IA analyse votre document et génère le contenu.</div>
    </div>

    <header class="editor-header">
        <div class="pha-container header-content">
            <img src="LOGO-POLYAERO.png" alt="Logo PolyAéro" class="header-logo">
            <div class="header-text">
                <h1>Éditeur de cours Polyaero Hautes-Alpes</h1>
            </div>
        </div>
    </header>

    <div class="pha-container">
        <div class="editor-wrapper">
            <label class="editor-label" for="editor">✏️ Éditeur de contenu</label>
            <textarea id="editor"></textarea>
        </div>
    </div>

    <script>
        let phaStyles = '';

        fetch('styles.css')
            .then(response => response.text())
            .then(css => {
                phaStyles = css;
                initializeTinyMCE();
            })
            .catch(err => {
                console.error('Error loading styles.css:', err);
                initializeTinyMCE();
            });

        function initializeTinyMCE() {
            tinymce.init({
                selector: '#editor',
                height: 800,
                menubar: 'file edit view insert format tools table help',
                extended_valid_elements: 'span[class|style|data-atom-id]',
                content_css: false,
                content_style: phaStyles + `
                    body {
                        padding: 1.5rem;
                        background: white;
                    }
                `,
                plugins: 'print preview paste importcss searchreplace autolink autosave save directionality code visualblocks visualchars fullscreen image link media table charmap hr pagebreak nonbreaking anchor toc insertdatetime advlist lists wordcount help charmap quickbars emoticons',
                toolbar: 'undo redo | bold italic underline strikethrough | fontselect fontsizeselect formatselect | alignleft aligncenter alignright alignjustify | outdent indent |  numlist bullist | forecolor backcolor removeformat | pagebreak | charmap emoticons | fullscreen  preview save print | insertfile image media template link anchor codesample | ltr rtl | equation-editor | aipdf',
                toolbar_sticky: true,
                autosave_ask_before_unload: true,
                autosave_interval: '30s',
                autosave_prefix: '{path}{query}-{id}-',
                autosave_restore_when_empty: false,
                autosave_retention: '2m',
                image_advtab: true,
                importcss_append: true,
                image_caption: true,
                quickbars_selection_toolbar: 'bold italic | quicklink h2 h3 blockquote quickimage quicktable',
                noneditable_noneditable_class: 'mceNonEditable',
                toolbar_mode: 'sliding',
                contextmenu: 'link image imagetools table',
                external_plugins: {
                    'equation-editor': '/equation-editor/plugin.min.js'
                },
                equation_editor_config: {
                    url: '/equation-editor/editor/equation_editor.html',
                    origin: window.location.origin,
                    title: 'Éditeur d\'équations',
                    space_after_content: '&nbsp;',
                    btn_cancel_text: 'Annuler',
                    btn_ok_text: 'Insérer',
                    mathlive_config: {
                        smartMode: true,
                    },
                },
                setup: function (editor) {
                    editor.ui.registry.addButton('aipdf', {
                        text: 'AI PDF',
                        icon: 'upload',
                        onAction: function () {
                            openAIDialog(editor);
                        }
                    });
                }
            });
        }

        function openAIDialog(editor) {
            editor.windowManager.open({
                title: 'Envoyer un fichier à l\'IA',
                body: {
                    type: 'panel',
                    items: [
                        {
                            type: 'htmlpanel',
                            html: '<input type="file" id="fileInput" accept=".pdf,image/*" style="width: 100%; padding: 0.5rem; border: 2px solid #009fe3; border-radius: 6px;" />'
                        },
                        {
                            type: 'textarea',
                            name: 'prompt',
                            label: 'Prompt AI',
                            placeholder: 'Décrivez ce que vous souhaitez générer à partir de ce fichier...'
                        }
                    ]
                },
                buttons: [
                    { type: 'cancel', text: 'Annuler' },
                    { type: 'submit', text: 'Envoyer', buttonType: 'primary' }
                ],
                onSubmit: function (api) {
                    const data = api.getData();
                    const prompt = data.prompt;
                    const input = document.getElementById('fileInput');

                    if (!input.files.length) {
                        alert('Veuillez sélectionner un fichier PDF ou une image.');
                        return;
                    }

                    const file = input.files[0];
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('prompt', prompt);

                    const overlay = document.getElementById('loadingOverlay');
                    overlay.classList.add('active');
                    editor.setProgressState(true);

                    fetch('http://54.38.224.140:5678/webhook/ai-pdf-1', {
                        method: 'POST',
                        body: formData
                    })
                        .then(res => res.text())
                        .then(responseText => {
                            let htmlContent = responseText;

                            // Try to parse as JSON
                            try {
                                const jsonResponse = JSON.parse(responseText);

                                if (jsonResponse.html) {
                                    htmlContent = jsonResponse.html;
                                } else if (jsonResponse.output && jsonResponse.output.html) {
                                    htmlContent = jsonResponse.output.html;
                                } else if (jsonResponse.text) {
                                    htmlContent = jsonResponse.text;
                                } else if (jsonResponse.output && jsonResponse.output.text) {
                                    htmlContent = jsonResponse.output.text;
                                }
                            } catch (e) {
                                // Not JSON, use as-is
                            }

                            // Check if HTML is encoded and decode if needed
                            if (htmlContent.includes('&lt;') || htmlContent.includes('&quot;') || htmlContent.includes('&amp;')) {
                                const tempDiv = document.createElement('div');
                                tempDiv.innerHTML = htmlContent;
                                htmlContent = tempDiv.innerHTML;

                                // Check again for double-encoding
                                if (htmlContent.includes('&lt;') || htmlContent.includes('&quot;')) {
                                    tempDiv.innerHTML = htmlContent;
                                    htmlContent = tempDiv.innerHTML;
                                }
                            }

                            console.log('Inserting HTML:', htmlContent.substring(0, 200));
                            editor.insertContent(htmlContent);
                            editor.setProgressState(false);
                            overlay.classList.remove('active');
                            api.close();
                        })
                        .catch(err => {
                            console.error('Erreur AI:', err);
                            editor.setProgressState(false);
                            overlay.classList.remove('active');
                            alert("Erreur lors de l'envoi à l'IA.");
                        });
                }
            });
        }
    </script>
</body>

</html>
